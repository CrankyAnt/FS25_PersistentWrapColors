name: Repository hygiene
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  repository_dispatch:
    types: [dependabot-merged]
permissions: {}
jobs:
  hygiene:
    permissions:
      actions: read
      contents: read
      pull-requests: read
    uses: CrankyAnt/SharedWorkflows/.github/workflows/repository-hygiene.yml@v1
